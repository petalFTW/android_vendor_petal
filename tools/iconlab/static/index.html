<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IconLab</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">IL</span>
      <div>
        <div class="brand-title">IconLab</div>
        <div class="brand-sub">subject mask review</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="progress-text"><span id="progress-text">0 / 0</span><span id="progress-pct">0%</span></div>
    </div>

    <input id="search" type="search" placeholder="Filter package or label" autocomplete="off">

    <div id="list" class="list"></div>

    <div class="side-actions">
      <button id="teacher-btn" class="btn">Run teacher</button>
      <button id="export-btn" class="btn">Export dataset</button>
      <div id="teacher-status" class="tiny"></div>
    </div>
  </aside>

  <main>
    <header id="topbar">
      <div class="titles">
        <div id="item-label" class="item-label">No icon selected</div>
        <div id="item-package" class="item-package"></div>
      </div>
      <div class="badges">
        <span id="item-kind" class="badge">-</span>
        <span id="item-status" class="badge">todo</span>
        <span id="dirty" class="badge dirty" hidden>unsaved</span>
      </div>
    </header>

    <section id="stage">
      <canvas id="canvas" width="512" height="512"></canvas>
      <div id="empty" class="empty">Select an icon from the list</div>
    </section>

    <section id="toolbar">
      <div class="group">
        <button id="add-btn" class="tool active" title="Add to subject (1)">Add</button>
        <button id="erase-btn" class="tool" title="Remove from subject (2)">Erase</button>
        <button id="undo-btn" class="tool" title="Undo (Ctrl+Z)">Undo</button>
      </div>

      <label class="range">
        <span>Brush</span>
        <input id="brush" type="range" min="4" max="96" value="28">
        <span id="brush-value" class="mono">28</span>
      </label>

      <label class="range">
        <span>Threshold</span>
        <input id="threshold" type="range" min="0" max="100" value="50">
        <span id="threshold-value" class="mono">50</span>
      </label>

      <div class="group">
        <button id="overlay-btn" class="tool active" title="Toggle mask overlay (E)">Overlay</button>
        <button id="reset-btn" class="tool" title="Discard edits and reload teacher">Reset</button>
        <button id="save-btn" class="tool" title="Save mask">Save</button>
      </div>

      <div class="group right">
        <button id="skip-btn" class="tool" title="Skip (S)">Skip</button>
        <button id="accept-btn" class="tool primary" title="Accept (A)">Accept</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
